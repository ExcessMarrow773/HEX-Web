{% extends "base.html" %}
{% block page_title %}Create Post{% endblock page_title %}

{% load static %}

{% block body %}
<h1>Create Post</h1>

<form method="post" enctype="multipart/form-data" id="upload-form">
    {% csrf_token %}
    {{ form.as_p }}

    {% if request.META.HTTP_SEC_FETCH_DEST == 'document' %}
        <button type="submit" class="btn btn-primary">Submit</button>
        <a href="{% url 'app:index' %}">Cancel</a>
    {% endif %}
    
</form>
{% endblock body %}
