{% extends "base.html" %}

{% block body %}
<form method="post">
    <h2>Login</h2>
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Login</button>
  {% comment %} <p>Don't have an account? <a href="{% url 'accounts:register' %}">Register here</a>.</p> {% endcomment %}
</form>
{% endblock body %}
