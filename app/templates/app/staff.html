{% extends 'base.html' %}
{% load static %}


{% block body %}
<div class="staff-card-grid">

{% for account in staff_accounts %}
<section class="card">
	<p>
		<img class="logo" src="{{ account.profile.headshot.url }}" width="500" height="500">
		{{account.first_name.capitalize}} {{account.last_name.capitalize}}
		<strong>{{account.profile.job_title.capitalize}}</strong>
	</p>
</section>
{% endfor %}
<section></section>
</div>
{% endblock body %}
